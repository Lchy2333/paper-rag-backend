server:
  host: "0.0.0.0"
  port: 8080
  max_upload_size_mb: 20
  upload_dir: "./uploads"
  read_timeout_sec: 60
  write_timeout_sec: 300
  # 服务间鉴权：Agent → RAG 调用时须携带请求头 X-API-Key: <此值>。
  # 留空 = 不启用鉴权（本地开发模式）；生产建议配置。
  # 用法：设置环境变量 RAG_API_KEY，并把下行改为 api_key: "${RAG_API_KEY}"
  # 生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
  api_key: ""

log:
  # 日志级别：info（生产默认）/ debug（打开详细日志，含各阶段明细、公式 OCR 逐条结果）
  # 支持 ${LOG_LEVEL} 注入环境变量
  level: "info"

ai:
  provider: "openai-compatible"
  # OpenAI 兼容接口的默认 base_url，例如：
  #   OpenAI:      https://api.openai.com/v1
  #   DeepSeek:    https://api.deepseek.com/v1
  #   火山方舟标准: https://ark.cn-beijing.volces.com/api/v3
  #   火山方舟Plan: https://ark.cn-beijing.volces.com/api/plan/v3/
  #   Ollama 本地: http://localhost:11434/v1
  # 注意：embedding 和 chat 可分别在各自节里覆盖 base_url（见下）
  base_url: "http://localhost:11434/v1"
  # 支持 ${ENV_VAR} 语法引用环境变量，例如 ${OPENAI_API_KEY}。
  # Ollama 本地不需要 key，填任意值即可。
  api_key: "ollama"
  timeout_sec: 300

  embedding:
    # 可选：单独指定向量化服务的 base_url / api_key，为空则回退到 ai.base_url / ai.api_key。
    # 例如 embedding 发到另一个本地服务：
    #   base_url: "http://192.168.1.10:11434/v1"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    # 使用 Ollama 本地多语言向量模型 bge-m3，中文/英文混合语义强，维度 1024
    # （必须与数据库 VECTOR(n) 一致）
    model: "bge-m3"
    dimension: 1024
    batch_size: 16

  chat:
    # 可选：单独指定对话服务的 base_url / api_key，为空则回退到 ai.base_url / ai.api_key。
    # 例：走火山方舟（Agent Plan 套餐时用 /api/plan/v3/，标准 API 用 /api/v3）：
    #   base_url: "https://ark.cn-beijing.volces.com/api/plan/v3/"
    #   api_key: "${ARK_API_KEY}"
    base_url: "https://ark.cn-beijing.volces.com/api/plan/v3/"
    api_key: "${ARK_API_KEY}"
    model: "deepseek-v4-flash"
    temperature: 0.2
    max_tokens: 2048

  formula:
    # 公式 OCR：把公式裁剪图识别成 LaTeX，用多模态视觉模型。
    # base_url / api_key 为空则回退到 ai.base_url / ai.api_key。
    # 例：Ollama 本地视觉模型（需 ollama pull qwen2.5vl:7b）：
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model: "qwen2.5vl:7b"
    temperature: 0.1
    max_tokens: 1024

  rerank:
    # 重排序（精排）：三路混合粗排后，用 cross-encoder 对候选重打分排序。
    # 协议为 /rerank（Jina/Cohere 形状，SiliconFlow / Xinference 同款）。
    # 失败自动降级为粗排顺序（fail-open），不阻塞问答。
    # 注意：base_url 和 api_key 要成对显式填——留空会回退到 ai.base_url / ai.api_key
    #（若 ai.* 指向其他服务商，鉴权会对不上）。
    # SiliconFlow 的 BAAI/bge-reranker-v2-m3 免费（2026-10 实测），限流 RPM 2000 / TPM 50 万。
    enabled: false
    model: "BAAI/bge-reranker-v2-m3"
    base_url: "https://api.siliconflow.cn/v1"
    api_key: "${SILICONFLOW_API_KEY}"
    candidate_pool: 30   # 先从三路混合多捞 30 条候选，精排后截断回 top_k
    top_n: 0             # 0 = 沿用 rag.top_k（请求级 top_k 优先）
    timeout_sec: 15      # 独立短超时（提问热路径上，不能复用 chat 的长超时）

rag:
  chunk_size: 800
  chunk_overlap: 150
  top_k: 5
  similarity_threshold: 0.0
  # 异步摄入 worker 数（= 解析/OCR/向量化流水线的并发上限，天然限流），默认 2。
  # 上传接口只做接收段秒回，慢活由这些 worker 异步处理（见 AGENTS.md「异步摄入实现备忘」）。
  ingest_workers: 2
  # 检索不到相关内容时的兜底回复
  no_context_reply: "抱歉，在已上传的文档中没有找到与您问题相关的内容。"

database:
  # 存储实现：仅支持 postgres（本地数据库，pgvector 向量检索）
  type: "postgres"
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "${POSTGRES_PASSWORD}"
  dbname: "paper_rag"
  sslmode: "disable"
  max_conns: 10

render:
  # PDF 渲染（公式区域截图）：用 PyMuPDF（MuPDF 的 Python 绑定）
  # 安装: pip install pymupdf
  python_cmd: "python"          # Python 可执行文件，默认 python
  dpi: 150                      # 渲染分辨率，公式截图建议 150
  work_dir: ""                  # 渲染临时文件目录，留空用系统临时目录
